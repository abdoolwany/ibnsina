name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 */48 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://hepb-track.vercel.app/api/health
        continue-on-error: true
